apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::324860463113:role/eksctl-expense-c-nodegroup-expense-NodeInstanceRole-TLzvxPlQj4DK
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
  mapUsers: |
    - userarn: arn:aws:iam::324860463113:user/gana
      username: gana
      groups:
        - expense-trainee
    - userarn: arn:aws:iam::324860463113:user/bhanu
      username: bhanu
      groups:
        - expense-lead
    - userarn: arn:aws:iam::324860463113:user/amrutha
      username: amrutha
      groups:
        - expense-manager